name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: telegram-live-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out release source
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Set up Node and npm trusted publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: bun ci

      - name: Validate release inputs and package artifacts
        run: bun run release:validate

      - name: Run dedicated Bot lifecycle tests
        run: bun run test:live
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Publish distilled-telegram with provenance
        run: npm publish ./packages/distilled-telegram --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish alchemy-telegram with provenance
        run: npm publish ./packages/alchemy-telegram --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
